services:
  - type: web
    name: thinhphatfood
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        value: toda98520@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: thinhphatfood-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
